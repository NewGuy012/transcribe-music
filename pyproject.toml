[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcribe-music"
version = "0.2.0"
description = "Fast local Python CLI and SDK to convert digital scores and fallback PDF sheet music into validated MusicXML with chords and instrument fingerings."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.14,<3.15"
dependencies = [
    "typer",
    "pydantic",
    "music21",
    "converter21",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.optional-dependencies]
pdf = ["pymupdf"]
gp = ["pyguitarpro"]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
transcribe-music = "transcribe_music.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
